<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyControl">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#25282e">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MoneyControl</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo"><img src="icon-192.png" alt=""></span>
        <div><b>MoneyControl</b><small>controle financeiro</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button id="theme-btn" class="btn ghost small" type="button"></button>
      </div>
    </aside>
    <main class="main">
      <div id="banner"></div>
      <div id="view"></div>
    </main>
  </div>
  <button id="fab" class="fab" type="button" aria-label="Novo lançamento rápido">+</button>
  <div id="toasts"></div>
  <div id="tooltip" role="tooltip"></div>
  <script src="backend.js"></script>
  <script src="sync-config.js"></script>
  <script src="sync.js"></script>
  <script src="charts.js"></script>
  <script src="core.js"></script>
  <script src="pages.js"></script>
</body>
</html>
